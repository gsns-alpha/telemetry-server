<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DevicePulse — Telemetry Console{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2358a6ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='2'/%3E%3Cpath d='M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --bg-card: #1f2937;
            --border-color: #374151;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-primary: #38bdf8;
            --accent-primary-dim: rgba(56, 189, 248, 0.15);
            --accent-green: #34d399;
            --accent-green-dim: rgba(52, 211, 153, 0.15);
            --accent-blue: #38bdf8;
            --accent-blue-dim: rgba(56, 189, 248, 0.15);
            --accent-amber: #fbbf24;
            --accent-amber-dim: rgba(251, 191, 36, 0.15);
            --accent-red: #f87171;
            --accent-red-dim: rgba(248, 113, 113, 0.15);
            --accent-purple: #c084fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 260px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px 24px 12px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        .brand-text h2 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .brand-text span {
            font-size: 11px;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            display: block;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.15s ease;
        }

        .nav-item a:hover {
            color: var(--text-primary);
            background-color: var(--bg-card);
        }

        .nav-item.active a {
            color: var(--accent-primary);
            background-color: var(--accent-primary-dim);
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-weight: 600;
        }


        .sidebar-footer {
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            width: 100%;
            border-radius: 8px;
            color: var(--accent-red);
            text-decoration: none;
            font-size: 14px;
            background: none;
            border: none;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .logout-btn:hover {
            background-color: var(--accent-red-dim);
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 32px 40px;
            max-width: 1400px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .page-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Cards & Grid */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--card-accent, var(--accent-green));
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Tables & Content Box */
        .card-box {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-box-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .filter-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        select, input, .btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }

        select:focus, input:focus {
            border-color: var(--accent-green);
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: #000;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(255,255,255,0.01);
        }

        td {
            padding: 14px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            vertical-align: top;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255,255,255,0.02);
        }

        /* Badges & Tags */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-green { background-color: var(--accent-green-dim); color: var(--accent-green); border: 1px solid rgba(63,185,80,0.3); }
        .badge-blue { background-color: var(--accent-blue-dim); color: var(--accent-blue); border: 1px solid rgba(88,166,255,0.3); }
        .badge-amber { background-color: var(--accent-amber-dim); color: var(--accent-amber); border: 1px solid rgba(210,153,34,0.3); }
        .badge-red { background-color: var(--accent-red-dim); color: var(--accent-red); border: 1px solid rgba(248,81,73,0.3); }

        .time-text {
            color: var(--text-secondary);
            font-size: 12px;
            white-space: nowrap;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 20px;
        }

        .pagination a, .pagination span {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 12px;
        }

        .pagination .active {
            background-color: var(--accent-green-dim);
            color: var(--accent-green);
            border-color: var(--accent-green);
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            stroke: var(--border-color);
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 70px;
                padding: 16px 8px;
            }
            .brand-text, .nav-item a span, .logout-btn span {
                display: none;
            }
            .main-content {
                margin-left: 70px;
                padding: 20px;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <a href="{{ url_for('dashboard') }}" class="brand">
            <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="2"></circle>
                    <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"></path>
                </svg>
            </div>
            <div class="brand-text">
                <h2>DevicePulse</h2>
                <span>Telemetry Console</span>
            </div>
        </a>



        <ul class="nav-links">
            <li class="nav-item {% if request.path == '/dashboard' %}active{% endif %}">
                <a href="{{ url_for('dashboard') }}">
                    <span>📊</span>
                    <span>Overview</span>
                </a>
            </li>
            <li class="nav-item {% if request.path == '/dashboard/notifications' %}active{% endif %}">
                <a href="{{ url_for('dashboard_notifications') }}">
                    <span>🔔</span>
                    <span>Notifications</span>
                </a>
            </li>
            <li class="nav-item {% if request.path == '/dashboard/calls' %}active{% endif %}">
                <a href="{{ url_for('dashboard_calls') }}">
                    <span>📞</span>
                    <span>Call Logs</span>
                </a>
            </li>
            <li class="nav-item {% if request.path == '/dashboard/sms' %}active{% endif %}">
                <a href="{{ url_for('dashboard_sms') }}">
                    <span>💬</span>
                    <span>SMS Messages</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <a href="{{ url_for('logout') }}" class="logout-btn">
                <span>🚪</span>
                <span>Sign Out</span>
            </a>
        </div>
    </aside>

    <!-- Main View -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
